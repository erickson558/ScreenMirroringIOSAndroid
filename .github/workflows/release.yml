name: Auto Release on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - ".gitignore"

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from version.json
        id: version
        run: |
          $versionFile = Get-Content 'version.json' | ConvertFrom-Json
          $VERSION = $versionFile.version
          echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
          echo "Version detected: $VERSION"

      - name: Check if release exists
        id: check_release
        run: |
          $tagName = "v${{ steps.version.outputs.VERSION }}"
          try {
            $releaseUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tagName"
            $response = Invoke-RestMethod -Uri $releaseUrl -Headers @{"Authorization"="token ${{ secrets.GITHUB_TOKEN }}"} -ErrorAction Stop
            echo "Release already exists for $tagName"
            echo "EXISTS=true" >> $env:GITHUB_OUTPUT
          } catch {
            echo "Release does not exist, will create new one"
            echo "EXISTS=false" >> $env:GITHUB_OUTPUT
          }

      - name: Set up Python
        if: steps.check_release.outputs.EXISTS == 'false'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.9'

      - name: Install dependencies
        if: steps.check_release.outputs.EXISTS == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile with PyInstaller
        if: steps.check_release.outputs.EXISTS == 'false'
        run: |
          pyinstaller ScreenMirrorIOSAndroid.spec --noconfirm

      - name: Create Git Tag
        if: steps.check_release.outputs.EXISTS == 'false'
        run: |
          $tagName = "v${{ steps.version.outputs.VERSION }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag $tagName -m "Release $tagName"
          git push origin $tagName

      - name: Create GitHub Release
        if: steps.check_release.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }} - Auto Release
          files: dist/ScreenMirrorIOSAndroid.exe
          draft: false
          prerelease: false
          body: |
            ## 📦 Automated Release
            
            Version: **${{ steps.version.outputs.VERSION }}**
            
            This release was automatically generated when the version was updated in `version.json`.
            
            **Binary**: `ScreenMirrorIOSAndroid.exe`
            
            ### Installation
            Download the `.exe` file and run it directly.
